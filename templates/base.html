{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SIBU — Bienestar Universitario UNL{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{% static 'css/sibu.css' %}" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="{% url 'inicio' %}">SIBU · UNL</a>
      <div class="ms-auto navbar-text text-white">
        {% if user.is_authenticated %}{{ user.get_full_name|default:user.username }}
          · <a class="text-white" href="{% url 'logout' %}">Salir</a>
        {% else %}<a class="text-white" href="{% url 'login' %}">Ingresar</a>{% endif %}
      </div>
    </div>
  </nav>
  <main class="container py-4">
    {% block content %}{% endblock %}
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
